/* 레이아웃: 화면을 가득 채운 게임 창 하나. 위 자원 막대, 왼쪽 미션 카드, 오른쪽 나침반·지도 버튼, 아래 도구 막대(펼침 메뉴), 떠 있는 정보 카드·현황 서랍 */
:root{
  --bg:#dfe7ec;--ink:#1d2738;--muted:#5c6878;
  --panel:rgba(255,255,255,.95);--panel-solid:#ffffff;--line:rgba(29,39,56,.1);--soft:#f2f5f8;
  --accent:#ffb21a;--accent-deep:#e08e00;--accent-soft:#fff3d6;--accent-ink:#6b4300;
  --ok:#2f8a4e;--bad:#c63d2f;--warn:#a46a00;--civil:#2867b2;--civil-soft:#e3eefb;--build:#b04a1f;--build-soft:#fdeadf;
  --shadow:0 6px 18px rgba(22,34,52,.16),0 1px 3px rgba(22,34,52,.12);
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121821;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px}
.game{position:relative;height:calc(100dvh - 20px);min-height:560px;border-radius:18px;overflow:hidden;background:#bfe3f5;user-select:none;-webkit-user-select:none;color:var(--ink);touch-action:none}
#mission,#drawer,#sns,#modal{touch-action:pan-y}
#dock,#fly{touch-action:pan-x}
#city{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ov{position:absolute;z-index:2}
.pnl{background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
button{font:inherit;color:var(--ink);background:var(--panel-solid);border:0;border-radius:10px;cursor:pointer;min-height:40px;padding:0 12px}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{display:block;flex:none}
/* 위 막대 */
#hud{top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;height:48px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#5a3600}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.brand small{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:15px;color:var(--muted);line-height:1;margin-top:3px;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;height:48px;padding:0 14px 0 8px;position:relative}
.pill .pi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.pill .pv{display:flex;flex-direction:column;line-height:1}
.pill .pk{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.pill .pn{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pill .pn.neg{color:var(--bad)}
#mDelta{position:absolute;right:8px;top:-4px;font-family:var(--display);font-size:14px;color:var(--ok);opacity:0;transition:opacity .3s,transform .9s;pointer-events:none}
#mDelta.on{opacity:1;transform:translateY(-10px)}
.grow{flex:1}
.ctrl{display:flex;gap:2px;padding:0 3px;height:48px;align-items:center}
.ctrl button{min-height:44px;min-width:44px;padding:0 9px;display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:15px;background:transparent}
.ctrl button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ctrl .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
#menu{background:var(--accent);color:#3b2500}
/* 미션 카드 */
#mission{left:10px;width:min(320px,calc(100% - 90px));padding:12px 14px 13px;font-size:13.5px;line-height:1.45}
#mission[hidden]{display:none}
#mission .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
#mission .ml .mstg{font-style:normal;font-family:var(--body);font-size:11.5px;line-height:1.5;color:#1e4f7c;background:#e3eefb;border-radius:999px;padding:0 7px;margin-left:3px;white-space:nowrap}
.learn{background:#eef5fd;border-radius:12px;padding:9px 12px;color:#1e3a5c}
.learn b{color:#1e4f7c}
#mission .ml{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:14px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 10px 2px 7px}
#mission .mt{font-family:var(--display);font-size:22px;line-height:1.2;margin:6px 0 2px}
#mission p{margin:0 0 8px;color:#3d4a5a}
#mission ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#mission li .row{display:flex;justify-content:space-between;gap:8px;font-weight:500}
#mission li .v{font-family:var(--display);font-size:15px;color:#3d4a5a;white-space:nowrap;font-variant-numeric:tabular-nums}
#mission li.ok .v{color:var(--ok)}
#mission .bar2{height:8px;background:#e5eaf0;border-radius:4px;overflow:hidden;margin-top:4px}
#mission .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffc94d,#ffa600);border-radius:4px}
#mission li.ok .bar2 i{background:linear-gradient(90deg,#6fd08a,#2fa356)}
#mission .mtime{display:flex;align-items:center;gap:5px;margin-top:9px;font-family:var(--display);font-size:15px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
#mission .mtime.low{color:var(--bad)}
#mission .fold{min-height:44px;min-width:44px;padding:0;display:grid;place-items:center;background:var(--soft)}
#mission.folded p,#mission.folded .mchecks,#mission.folded .hint,#mission.folded .mmore{display:none!important}
#mission.tfold p.md{display:none!important}#mission.tfold p,#mission.tfold .mchecks,#mission.tfold .hint,#mission.tfold .reqs,#mission.tfold .chq,#mission.tfold .mmore,#mission.tfold .mtime{display:none}#mission.tfold .mt{font-size:17px;margin:4px 0 0}
#mission:not(.more) p.md{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}#mission:not(.more) .hint{display:none}
#mission .mmore{margin-top:8px;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;gap:5px;background:var(--civil-soft);color:var(--civil);font-family:var(--display);font-size:14.5px;border-radius:10px}
#mission.compact p,#mission.compact .hint,#mission.compact .reqs{display:none}
#mission .hint{display:flex;gap:6px;margin-top:8px;font-size:12.5px;color:var(--civil);background:var(--civil-soft);border-radius:8px;padding:6px 8px}
/* 오른쪽 지도 버튼 */
#mapctl{right:10px;display:grid;grid-template-columns:repeat(2,44px);gap:3px;padding:5px}
#mapctl button{width:44px;min-height:44px;padding:0;display:grid;place-items:center;background:transparent}
#mapctl button:hover{background:var(--soft)}
#mapctl #zhome{grid-column:span 2;width:auto}
#mapctl.row3{grid-template-columns:repeat(3,40px);gap:2px;padding:4px}
#mapctl.row3 button,#mapctl.row3 #zhome{grid-column:auto;width:40px;min-height:40px}
#views.short{gap:1px;padding:4px}
#views.short button{min-height:34px}
#views.short label{padding:2px 0 0}
#views.short label svg,#views.short label span{display:none}
/* 정보 보기(시티즈: 스카이라인의 인포뷰처럼 오른쪽 세로 막대) */
#views{right:10px;display:flex;flex-direction:column;gap:3px;padding:5px;width:64px}
#views button{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-family:var(--display);font-size:13px;background:transparent}
#views button[aria-pressed="true"]{background:var(--ink);color:#fff}
#views label{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--display);font-size:13px;padding:6px 0 2px;border-top:1px solid var(--line);margin-top:2px}
#views select{font:inherit;font-family:var(--display);font-size:12.5px;border:0;background:var(--soft);border-radius:8px;min-height:36px;width:56px;padding:0 2px;color:var(--ink)}
/* 수요 막대 */
.rci{display:flex;gap:5px;align-items:stretch;padding:6px 10px 4px 6px;margin-right:2px;border-right:1px solid var(--line);flex:none;min-height:70px}
.rci div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;width:15px}
.rci b{display:flex;align-items:flex-end;width:11px;height:40px;background:var(--soft);border-radius:4px;overflow:hidden}
.rci i{display:block;width:100%;border-radius:4px;transition:height .5s}
.rci span{font-family:var(--display);font-size:12.5px;color:var(--muted);line-height:1}
/* 도구 막대 */
#dock{left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:4px;padding:6px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:70px;min-height:70px;padding:6px 2px;background:transparent;border-radius:12px;position:relative;flex:none}
.cat .ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}
.cat span{font-family:var(--display);font-size:14px;line-height:1}
.cat[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cat.locked .ci{background:#c3cad3 !important}
.cat.locked span{color:#97a1ad}
.cat .dot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#2fa356;box-shadow:0 0 0 2px #fff}
.cat .more{position:absolute;bottom:22px;right:12px;width:14px;height:14px;border-radius:50%;background:#fff;color:var(--muted);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
#fly{bottom:96px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;max-width:calc(100% - 20px);overflow-x:auto}
#fly[hidden]{display:none}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:150px;min-height:120px;padding:10px 12px;background:var(--soft);border-radius:12px;text-align:left;flex:none}
.item .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;margin-bottom:2px}
.item b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15}
.item small{font-size:12px;color:var(--muted);line-height:1.35}
.item .price{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;font-family:var(--display);font-size:14px;color:var(--accent-ink);margin-top:auto}
.item.locked{opacity:.55}
.item[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
#toolTip{left:50%;transform:translateX(-50%);bottom:96px;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;font-size:14px;white-space:nowrap;max-width:calc(100% - 20px)}
@media (min-width:761px){#toolTip{max-width:calc(100% - 196px)}}
#toolTip[hidden]{display:none}
#toolTip .bpt{padding:0 10px;display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:14px;flex:none}
#toolTip .bpt[aria-pressed="true"]{background:#2a6fdb;color:#fff}
#bp{left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;font-size:14px;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;box-shadow:0 0 0 2px #2a6fdb,var(--shadow);color:#1e4f7c}
#bp[hidden]{display:none}
@media (min-width:1000px){#bp{width:max-content}}
#bp b{font-family:var(--display);font-weight:400;font-size:16px}
#bp button{min-height:42px;font-family:var(--display);font-size:14.5px;background:var(--soft)}
#bp .go{background:#2f8a4e;color:#fff}
#toolTip b{font-family:var(--display);font-weight:400;font-size:16px}
#info .xbtn{display:block;width:100%;margin-top:8px;padding:8px 10px;border:0;border-radius:10px;background:#2f8a4e;color:#fff;font:inherit;font-size:14px;cursor:pointer}
#unlock.buyl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#unlock.buyl button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:1px solid #d8dee6;border-radius:10px;background:#fff;font:inherit;font-size:13px;cursor:pointer;text-align:left}
#unlock.buyl button b{font-weight:600}
#unlock.buyl button small{color:#66707c;font-size:12px}
#unlock.buyl button:disabled{opacity:.5;cursor:default}

#info .xbtn.rep{background:#d98a2b}
#mission p.md,#mission .mchecks{font-size:16px;line-height:1.45}#mission .hint{font-size:15px}#mission p{font-size:15px}
#info{font-size:16px}#info .why{font-size:14px}#info .checks li.yall>span:last-child{font-size:15px}
#info .checks li.yall>span:last-child{font-size:13px;line-height:1.5;color:#45515f}#info .checks li.yall b{color:#2f8a4e;font-weight:600;margin-right:2px}
#info .xbtn:disabled{background:#c9d3cc;color:#55615a;cursor:default}
#toolTip .soil{flex:none;font-size:13px;color:#7a5a32;background:#f3eadb;border-radius:8px;padding:3px 8px}
#toolTip .soil b{font-size:14px}
#toolTip span{overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#toolTip button{min-height:40px;min-width:40px;padding:0;display:grid;place-items:center;background:var(--soft)}
#toolTip .rmode{display:flex;gap:3px;background:var(--soft);border-radius:10px;padding:2px;flex:none}
#toolTip .rmode button{padding:0 10px;font-family:var(--display);font-size:14px;background:transparent;min-height:40px;display:flex}
#toolTip .bpg button{align-items:center;gap:3px}
#toolTip .bpg button[data-bp="1"][aria-pressed="true"]{background:#2a6fdb}
#toolTip .rmode button[aria-pressed="true"]{background:var(--ink);color:#fff}
/* 정보 카드 */
#info{left:10px;bottom:96px;width:min(330px,calc(100% - 20px));padding:13px 14px;font-size:14px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#info[hidden]{display:none}
#info .ih{display:flex;gap:10px;align-items:flex-start}
#info .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
#info .nm{font-family:var(--display);font-size:21px;line-height:1.15}
#info .x{margin-left:auto;min-height:44px;min-width:44px;padding:0;display:grid;place-items:center;background:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.build{background:var(--build-soft);color:var(--build)}
.tag.civil{background:var(--civil-soft);color:var(--civil)}
.tag.lock{background:var(--accent-soft);color:var(--accent-ink)}
.tag.lux{background:#fff1c9;color:#7a5600}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.checks .m{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;margin-top:1px}
.checks .y .m{background:#3aa65c}.checks .n .m{background:#d9573f}.checks .w .m{background:#e0a422}
.checks .why{display:block;color:var(--muted);font-size:12.5px}
#infoDesc{margin:9px 0 0;color:#3d4a5a;font-size:13.5px}
/* 현황 서랍 */
#drawer{right:10px;width:min(330px,calc(100% - 20px));max-height:calc(100% - 200px);overflow-y:auto;padding:14px 16px}
#drawer[hidden]{display:none}
#sns{right:10px;width:min(320px,calc(100% - 20px));max-height:calc(100% - 200px);overflow-y:auto;padding:14px 16px}
#sns[hidden]{display:none}
#sns h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
#sns h3 button{min-height:30px;min-width:30px;padding:0;display:grid;place-items:center;background:var(--soft)}
#sns .feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#sns .feed li{display:flex;gap:9px;padding:9px 10px;border-radius:12px;background:#f6f8fb}
#sns .feed li.b{background:#fff3ef}
#sns .feed .fc{font-size:22px;line-height:1}
#sns .feed b{font-size:13px;margin-right:6px}
#sns .feed small{color:var(--muted);font-size:11.5px}
#sns .feed p{margin:3px 0 0;font-size:13.5px;line-height:1.4}
#mcard button{transition:opacity .18s}#mcard.hold button{pointer-events:none;opacity:.55}
#drawer .jump{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px;padding:6px 0;position:sticky;top:0;background:var(--panel-solid);z-index:2}#drawer .jump button{min-height:40px;padding:0 11px;font-size:13.5px;background:var(--soft);border-radius:999px}
#drawer .lrn{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.5;color:#33404f}#drawer .lrn b{display:block;color:var(--civil);font-weight:600}
@media (max-height:690px){.maps.one{grid-template-columns:minmax(0,236px)!important}}
#snsBtn{position:relative}#statBtn{position:relative}#statBtn.ndot::after{content:'';position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:#d9473a;box-shadow:0 0 0 2px #fff}
#snsBtn .sbdg{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#d9473a;color:#fff;font:600 10px/16px system-ui;font-style:normal;padding:0 4px}
#drawer h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
#drawer h3 button{min-height:30px;min-width:30px;padding:0;display:grid;place-items:center;background:var(--soft)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.dem{display:flex;gap:10px;margin:12px 0 4px;align-items:flex-end;height:60px;background:var(--soft);border-radius:10px;padding:8px 10px 6px}
.dem div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.dem i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;min-height:3px}
.wide{width:100%;margin-top:10px;background:var(--accent);color:#3b2500;font-family:var(--display);font-size:16px}
.wide:disabled{background:var(--soft);color:var(--muted);cursor:default}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding:7px 9px;border-radius:9px;background:var(--soft);line-height:1.45}
.log li time{color:var(--muted);font-size:11.5px;margin-right:5px;font-variant-numeric:tabular-nums}
/* 알림·자막·창 */
#toast{left:50%;transform:translate(-50%,-6px);max-width:min(560px,calc(100% - 40px));background:rgba(29,39,56,.94);color:#fff;font-size:14.5px;padding:10px 16px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;z-index:4;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#cap{left:50%;transform:translateX(-50%);bottom:96px;width:min(680px,calc(100% - 24px));display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;z-index:4}
#cap[hidden]{display:none}
#capStep{flex:none;background:var(--accent);color:#3b2500;font-family:var(--display);font-size:15px;border-radius:999px;padding:2px 11px;font-variant-numeric:tabular-nums}
#capText{margin:0;font-size:15px;line-height:1.5;flex:1}
#capStop{flex:none;background:var(--soft);min-height:36px;font-family:var(--display)}
#modal{position:absolute;inset:0;background:rgba(18,28,44,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:6;overflow:auto}
#modal[hidden]{display:none}
.mcard{background:#fff;border-radius:22px;width:100%;max-width:520px;padding:24px 24px 20px;margin:auto;box-shadow:0 20px 50px rgba(10,20,40,.35)}
.mcard.wide{max-width:940px}
.mcard h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.15;margin:0 0 6px}

.mcard .eyebrow{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:15px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 11px;margin-bottom:8px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.hero .logo{width:56px;height:56px;border-radius:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;min-height:108px;background:#f4f6f9;border-radius:16px;font-weight:400;line-height:1.45}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.mnote{margin:14px 0 0;font-size:12.5px;color:#6b7783}

/* v0.6: 되돌리기, 따라 하기, 난이도 */
#undo[aria-disabled="true"]{opacity:.35;cursor:default}
#coach{left:10px;width:min(430px,calc(100% - 100px));padding:12px 14px 13px;z-index:4;box-shadow:0 0 0 3px #ffb21a,var(--shadow)}
#coach[hidden]{display:none}
#coach .chh{display:flex;align-items:center;gap:8px}
#coachStep{flex:none;background:var(--accent);color:#3b2500;font-family:var(--display);font-size:14px;border-radius:999px;padding:1px 10px;font-variant-numeric:tabular-nums}
#coachTitle{font-family:var(--display);font-weight:400;font-size:19px;flex:1}
#coachSkip{min-height:32px;background:var(--soft);font-family:var(--display);font-size:14px}
#coachText{margin:6px 0 0;font-size:15px;line-height:1.5}
#coachRing{border:3px solid #ffb21a;border-radius:16px;box-shadow:0 0 0 5px rgba(255,178,26,.28);pointer-events:none;z-index:5;animation:ringp 1.1s ease-in-out infinite}
#coachRing[hidden]{display:none}
@keyframes ringp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.7}}
@media (prefers-reduced-motion: reduce){#coachRing{animation:none}}
.diffs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.diffs button{flex:1;min-width:120px;min-height:54px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;background:#f2f5f8;border-radius:12px;padding:6px 12px;text-align:left}
.diffs button b{font-family:var(--display);font-weight:400;font-size:17px}
.diffs button small{font-size:12px;color:#5c6878}
.diffs button[aria-pressed="true"]{background:#fff6df;box-shadow:inset 0 0 0 2px var(--accent)}
#views button{min-height:44px}

/* v0.9: 화질·속도 표시 */
#fpsTag{right:96px;padding:3px 9px;border-radius:8px;background:rgba(29,39,56,.78);color:#fff;font:600 12.5px/1.4 var(--body);font-variant-numeric:tabular-nums;pointer-events:none}
#fpsTag[hidden]{display:none}
#moneyPill.bump{animation:mbump .38s cubic-bezier(.3,1.6,.5,1)}@keyframes mbump{0%{transform:scale(1)}35%{transform:scale(1.09) rotate(-1.5deg)}100%{transform:scale(1)}}
.insl{display:grid;gap:4px;margin:10px 0 2px;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:14px}
.slotrow{margin-top:10px;display:flex;justify-content:flex-end}.slotbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:12px;min-height:44px;padding:6px 14px;color:var(--ink);font-size:14.5px}.slotbtn small{color:var(--muted);font-size:12.5px}
.slots{display:grid;gap:8px;margin:14px 0 4px}.slot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);border:2px solid transparent}.slot.cur{border-color:#f2c94c;background:#fdf6df}.slot.empty{opacity:.7}.slot .sn{flex:none;width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center;font-family:var(--display);font-size:16px}.slot .si{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.slot .si b{font-size:15.5px}.slot .si b em{font-style:normal;font-size:12px;background:#f2c94c;color:#5a4300;border-radius:6px;padding:1px 6px;margin-left:4px}.slot .si span{font-size:12.5px;color:var(--muted)}.slot .sb{display:flex;gap:6px;flex:none}.slot .sb button{min-height:40px;padding:0 12px;border-radius:10px;border:0;font-size:14px}.slot .sload{background:var(--accent);color:var(--accent-ink)}.slot .sdel{background:#fff;color:#b4442c}.slot .sdel.sure{background:#d9573f;color:#fff}.slot .sexp{background:#fff;color:var(--ink)}#slImp.sure small{color:#b4442c}.opts.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media (max-width:560px){.opts.two{grid-template-columns:1fr}}
#drawer .dxb{display:block;width:100%;margin-top:6px;min-height:44px;padding:8px 10px;border:0;border-radius:10px;background:#2f8a4e;color:#fff;font:inherit;font-size:14px;cursor:pointer}
@media (max-width:560px){.slot{flex-wrap:wrap}.slot .sb{width:100%}.slot .sb button{flex:1}}
#satPill,#scorePill{cursor:pointer}.sil{display:grid;gap:8px;margin:14px 0 4px}.sir{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:4px 10px;font-size:14px}.sir i{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.sir i b{display:block;height:100%;border-radius:5px}.sir em{font-style:normal;text-align:right;font-family:var(--display)}.sir small{grid-column:2/4;color:var(--muted);font-size:12.5px;margin-top:-3px}.sir.sc{grid-template-columns:1fr auto;padding:8px 12px;background:var(--soft);border-radius:10px}
.item .price small{white-space:nowrap}.item .price small.upc{flex-basis:100%;margin:0;color:#8a5a2b}
.opt small.svw{display:block;color:#9a2f1c;opacity:1}
.svwp{color:#b4442c!important;margin:12px 0 0!important;font-size:14px!important}
/* v0.26: 미션별 시연 */
.dmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.dmodes .mode{min-height:0;padding:10px 12px;gap:10px}
.dmodes .mode .ci{width:38px;height:38px;border-radius:11px}
.dmodes .mode b{font-size:18px}
.dmodes .mode span{font-size:13px}
@media (min-width:1100px) and (max-height:760px){.mcard.dpick{max-width:1220px}.dpick .dmodes{grid-template-columns:repeat(5,1fr)}.dpick .dmodes .mode{flex-direction:column;gap:6px}}
#mission .mhr{display:flex;gap:6px;align-items:center;flex:none}
#mission .mdemo{min-height:44px;padding:0 10px;display:flex;align-items:center;gap:4px;background:#e8f1fc;color:#1e4f7c;font-family:var(--display);font-size:14px;border-radius:10px}

/* v0.25: 하루 결산 카드 */
#recap{width:236px;padding:9px 11px 10px;font-size:13px;line-height:1.4;cursor:pointer;z-index:3;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s}
#recap.on{opacity:1;transform:none}
#recap[hidden]{display:none}
#recap .rch{display:flex;align-items:center;gap:5px;margin-bottom:6px;color:#b77800}
#recap .rch b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--ink)}
#recap .rch span{font-size:12px;color:var(--muted);flex:1}
#recap .rch i{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--muted)}
#recap .rcg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#recap .rcg div{background:var(--soft);border-radius:9px;padding:4px 8px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:5px}
#recap .rcg span{width:100%;font-size:11.5px;color:var(--muted)}
#recap .rcg b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums}
#recap .rcg em{font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
#recap .rcg em.up{color:var(--ok)}#recap .rcg em.dn{color:var(--bad)}
#recap .rcn{display:flex;gap:5px;align-items:flex-start;margin-top:7px;font-size:12.5px;color:#6b4300}
#recap .rcn.ok{color:var(--ok)}
#recap .rcn svg{flex:none;margin-top:1px}
/* v0.25: 15분 도전 */
#mission .ml .cht{font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;margin-left:4px;color:var(--ink)}
#mission .ml .cht.low{color:var(--bad)}
#mission .mt.chs small{display:block;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:1px}
#mission .chm{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;margin:6px 0 2px;font-size:12.5px;align-items:center}
#mission .chm b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
#mission .chm i{display:block;height:6px;border-radius:3px;background:#e5eaf0;overflow:hidden}
#mission .chm i s{display:block;height:100%;background:linear-gradient(90deg,#8fd3a5,#2fa356)}
#mission.folded .chm,#mission.folded .chq,#mission.compact .chq{display:none}
.chrules{background:#f4f6f9;border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:14px;line-height:1.6;color:#33404f}
.chrules b{color:var(--ink)}
.chset{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin:0 0 6px}
.chmap canvas{width:100%;height:auto;max-height:26vh;object-fit:contain;display:block;border-radius:14px;background:#e6efe1}
.chout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.chout .opts{margin-top:6px}
.chmap>b{display:block;font-family:var(--display);font-weight:400;font-size:17px;margin-top:6px}
.chrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chrow .namein{flex:1;min-width:0;width:auto}
.chbl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chbl li{display:flex;justify-content:space-between;gap:8px;background:#f4f6f9;border-radius:10px;padding:6px 10px;font-size:14px}
.chbl li span{color:var(--accent-ink);font-family:var(--display);white-space:nowrap}
.chtv{margin-top:12px;font-size:13.5px;color:#4a5767}
.chtv summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
.chtv .namein{font-size:16px;padding:6px 10px;margin:4px 0;min-width:90px}
.chtv p{margin:6px 0 0}
.chtv .okc{color:var(--ok);font-weight:600}.chtv .badc{color:var(--bad);font-weight:600}
.chres{display:flex;align-items:center;gap:16px;margin:2px 0 6px}
.chmed{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:44px;flex:none;transform:scale(.3);opacity:0;transition:transform .5s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.chmed.on{transform:none;opacity:1}
.chbig{font-family:var(--display);font-size:46px;line-height:1.05;font-variant-numeric:tabular-nums}
.chbig small{font-size:20px;margin-left:3px}
.chbd{list-style:none;margin:6px 0 8px;padding:0;display:grid;gap:5px}
.chbd li{display:grid;grid-template-columns:7.5em 1fr 5.5em;gap:8px;align-items:center;font-size:14px}
.chbd li i{display:block;height:8px;border-radius:4px;background:#e5eaf0;overflow:hidden}
.chbd li i s{display:block;height:100%;background:linear-gradient(90deg,#8fd3a5,#2fa356)}
.chbd li b{font-variant-numeric:tabular-nums;text-align:right}
.chspw{background:#f4f6f9;border-radius:12px;padding:6px 10px 4px;margin:2px 0 4px}.chspw span{font-size:12.5px;color:#4a5767}
.chsp{width:100%;height:64px;display:block}
.chcode{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:#fff6df;border-radius:14px;padding:10px 14px;margin:8px 0}
.chcode b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.06em}
.chcode small{font-size:12.5px;color:#6b4300}
@media (max-width:760px){.chout{grid-template-columns:1fr;gap:4px}}
/* 세로 태블릿(800): 땅 고르기 안내 줄의 닫기 버튼이 밖으로 삐져나오던 것(v0.24부터) */
@media (max-width:900px){#toolTip{gap:5px;padding-left:8px}#toolTip .rmode button{padding:0 9px}#toolTip .soil{padding:3px 6px}}
@media (max-width:640px){.chset{grid-template-columns:1fr}.chbig{font-size:38px}.chbd li{grid-template-columns:6.5em 1fr 5em}}
.qrow{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.qrow label{font-family:var(--display);font-size:15px}
.qrow select{flex:1;font:inherit;font-size:14px;min-height:36px;border:0;border-radius:9px;background:var(--soft);color:var(--ink);padding:0 8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:36px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#e08e00}

<body>
<div class="game" id="game">
  <canvas id="city" role="img" aria-label="도시 건설 게임 지도. 강이 상류에서 하류로 흐르고, 도로와 구역, 시설을 지을 수 있어요."></canvas>
  <div id="hud" class="ov">
    <div class="brand pnl"><div class="logo" id="logo1"></div><div><b id="cityNm">우리 동네</b><small id="clock"></small></div></div>
    <div class="pills">
      <div class="pill pnl" id="moneyPill" role="button" tabindex="0" title="예산·세금 보기"><div class="pi" style="background:#fff1cc;color:#b77800" id="icMoney"></div><div class="pv"><span class="pk">예산</span><span class="pn" id="money">0</span></div><span id="mDelta"></span></div>
      <div class="pill pnl"><div class="pi" style="background:#e3f3e7;color:#2f8a4e" id="icPop"></div><div class="pv"><span class="pk">인구</span><span class="pn" id="pop">0</span></div></div>
      <div class="pill pnl opt2" id="satPill" role="button" tabindex="0" title="만족도 자세히"><div class="pi" style="background:#e5effb;color:#2867b2" id="icSat"></div><div class="pv"><span class="pk">만족도</span><span class="pn" id="sat">0</span></div></div>
      <div class="pill pnl opt2" id="scorePill" role="button" tabindex="0" title="점수 자세히"><div class="pi" style="background:#f1e9fb;color:#7a52c7" id="icScore"></div><div class="pv"><span class="pk">점수</span><span class="pn" id="score">0</span></div></div>
    </div>
    <div class="grow"></div>
    <div class="ctrl pnl" role="group" aria-label="시간">
      <button id="sp0" type="button" aria-label="일시정지"></button>
      <button id="sp1" type="button" aria-label="보통 속도">1×</button>
      <button id="sp2" type="button" class="sx" aria-label="2배 속도">2×</button>
      <button id="sp4" type="button" class="sx" aria-label="4배 속도">4×</button>
      <span class="sep"></span>
      <button id="undo" type="button" aria-label="되돌리기" title="되돌리기 (Ctrl+Z)"></button>
      <button id="sound" type="button" aria-label="소리 끄기"></button>
      <button id="snsBtn" type="button" aria-label="시민 SNS"></button>
      <button id="statBtn" type="button" aria-label="도시 현황"></button>
      <button id="menu" type="button"></button>
    </div>
  </div>
  <div id="mission" class="ov pnl" hidden></div>
  <div id="mapctl" class="ov pnl">
    <button id="zin" type="button" aria-label="확대"></button>
    <button id="zout" type="button" aria-label="축소"></button>
    <button id="rl" type="button" aria-label="왼쪽으로 90도 돌리기"></button>
    <button id="rr" type="button" aria-label="오른쪽으로 90도 돌리기"></button>
    <button id="zhome" type="button" aria-label="우리 땅 전체 보기"></button>
  </div>
  <div id="views" class="ov pnl" role="group" aria-label="보기"></div>
  <div id="sns" class="ov pnl" hidden></div>
<div id="drawer" class="ov pnl" hidden></div>
  <div id="info" class="ov pnl" hidden></div>
  <div id="toolTip" class="ov pnl" hidden></div>
  <div id="bp" class="ov pnl" hidden></div>
  <div id="fly" class="ov pnl" hidden></div>
  <div id="dock" class="ov pnl"></div>
  <div id="banner" class="ov" hidden role="status" aria-live="polite"></div>
  <div id="coachRing" class="ov" hidden></div>
  <div id="coach" class="ov pnl" hidden><div class="chh"><span id="coachStep"></span><b id="coachTitle"></b><button type="button" id="coachSkip">그만하기</button></div><p id="coachText"></p></div>
  <div id="toast" class="ov" role="status" aria-live="polite"></div>
  <div id="recap" class="ov pnl" hidden role="status" aria-live="polite"></div>
  <div id="fpsTag" class="ov" hidden></div>
  <div id="cap" class="ov pnl" hidden aria-live="polite"><span id="capStep"></span><p id="capText"></p><button id="capStop" type="button">멈추기</button></div>
  <div id="modal" class="ov" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>
</div>
<p class="note">[물] 보기의 화살표가 강이 흐르는 방향이에요. [살펴보기]에서는 끌어서 지도를 움직이고, 다른 도구를 고르면 끌어서 지어요. 두 손가락으로는 언제나 이동·확대돼요. 게임은 이 태블릿에 자동 저장돼요.</p>

function startMission(k){missionIdx=k;noUndo();if(k===1&&mode==='campaign'&&!demo&&!idle&&!bpMode){bpMode=true;tipKey='';setTimeout(()=>toast('이제부터는 설계가 먼저예요! 도구로 그리면 파란 점선 설계도가 되고, [시공하기]를 눌러야 지어져요. 급할 땐 도구를 고르면 아래에 뜨는 [바로 짓기]를 눌러요.'),900)}if(k===6&&flags.soil0==null)flags.soil0=flags.soilMoved||0;if(mode==='campaign'&&k===8&&!flags.aged){flags.aged=1;for(const o of things)if(ageK(o.kind)&&!(o.build>0))o.wear=(o.bornH!=null&&hours-o.bornH<96)?3:20+rnd(o.i*7+o.j*3)*35;for(let q=0;q<N*N;q++)if(road[q])rw[q]=15+rnd(q*1.7)*55}const m=CAMPAIGN[k];goal={kind:'mission',title:m.title,desc:m.desc,checks:m.checks,hint:m.hint,start:hours,limit:null};goalState='play';renderMission(true)}

let toastT=0,toastHold=0,toastNext=null;
function toast(msg,lo){if(idle&&!demo)return;const now=performance.now(),dur=Math.min(8000,Math.max(3400,String(msg).length*70));if(lo&&now<toastHold){toastNext=msg;return}const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);if(!lo)toastHold=now+dur;toastT=setTimeout(()=>{el.classList.remove('on');const m=toastNext;toastNext=null;if(m)toastT=setTimeout(()=>toast(m,1),400)},dur)}
function pushLog(msg){const h=hod(),d=Math.floor(hours/24)+1;logItems.unshift({time:d+'일 '+String(Math.floor(h)).padStart(2,'0')+':00',msg});logItems=logItems.slice(0,8);renderDrawer(true)}
const WGAP=8,WCALM=k=>/^(roadw|dry|lvcap|subfull|nosub|nosew|smog|dz.|noise|export|jam|gwlow|lf80|damlow|luxdown)$/.test(k);
function pushQuiet(msg){pushLog(msg);if($('drawer').hidden)$('statBtn').classList.add('ndot')}
function warnOnce(key,msg,cool=36){if(idle)return;if(tut){if(warned[key]===undefined){warned[key]=hours;pushLog(msg)}return}if(demo&&key!=='dirty'&&key!=='smog')return;const now=hours;if(warned[key]!==undefined&&now-warned[key]<cool)return;warned[key]=now;
  if(!demo&&WCALM(key)){if(now-(flags.wLast==null?-99:flags.wLast)<WGAP){pushQuiet(msg);return}flags.wLast=now}pushLog(msg);toast(msg,1)}
function tileFree(i,j){const o=tobj[ix(i,j)];return !hv[ix(i,j)]&&!sroad(ix(i,j))&&!water[ix(i,j)]&&!levee[ix(i,j)]&&!steep(i,j)&&(!o||o.kind==='tree')}
function clearTree(i,j){const o=tobj[ix(i,j)];if(o&&o.kind==='tree')removeThing(o)}
function roadTiles(a,b){const out=[];const di=b[0]-a[0],dj=b[1]-a[1];
  if(Math.abs(di)>=Math.abs(dj)){const s=Math.sign(di)||1;for(let i=a[0];i!==b[0]+s;i+=s)out.push([i,a[1]])}else{const s=Math.sign(dj);for(let j=a[1];j!==b[1]+s;j+=s)out.push([a[0],j])}return out}
function rectTiles(a,b){const out=[];for(let i=Math.min(a[0],b[0]);i<=Math.max(a[0],b[0]);i++)for(let j=Math.min(a[1],b[1]);j<=Math.max(a[1],b[1]);j++)out.push([i,j]);return out}

const CARC=['#e8735c','#4f7fc4','#f2b705','#f4f6f8','#4f9b6a','#8a6bc0','#39465a','#e3923e'];
const isRoad=(i,j)=>inb(i,j)&&road[ix(i,j)]&&!(bClosed&&water[ix(i,j)])&&!isFlood(ix(i,j));
function roadNb(i,j){const r=[];for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]])if(isRoad(i+a,j+b))r.push([i+a,j+b]);return r}
function updateCars(sdt){
  const h=hod(),tr=h<5||h>=23?.12:Math.min(1,.35+Math.exp(-((h-8)**2)/2.4)*.7+Math.exp(-((h-18)**2)/3.4)*.7);
  let nRoad=0;for(let k=0;k<N*N;k++)nRoad+=road[k];
  const target=nRoad<3?0:Math.min(150,Math.round((3+CART*.5+(stat.jam||0)*1.5)*tr*(qlvl()>=2?.5:1)));let nN=0;for(const c of cars)if(!c.kind)nN++;
  if(nN<target&&Math.random()<sdt*3){const k=pickCarRoad();if(k>=0&&road[k]){const i=Math.floor(k/N),j=k%N,nb=roadNb(i,j);
    if(nb.length){const n=nb[Math.random()*nb.length|0],nbus=things.filter(o=>o.kind==='bus').length;cars.push({car:1,i,j,ti:n[0],tj:n[1],p:0,v:1.1+Math.random()*.6,col:CARC[Math.random()*CARC.length|0],bus:nbus<2&&Math.random()<.08+.04*nbus,life:30+Math.random()*60})}}}
  vehTick(sdt);
  for(const c of cars){const ck=ix(c.i,c.j),cr=tload[ck]/capOf(ck),em=c.kind==='amb'||c.kind==='fire';c.p+=c.v*sdt/(1+Math.max(0,cr-.5)*(em?.5:2.4));c.life-=c.kind?sdt:sdt*(cr<.15?3:1);
    if(!isRoad(c.ti,c.tj)||!isRoad(c.i,c.j)){c.dead=true;continue}
    while(c.p>=1){c.p-=1;const pi=c.i,pj=c.j;c.i=c.ti;c.j=c.tj;
      if(c.route){c.ri++;if(c.ri+1>=c.route.length){c.dead=true;break}const k=c.route[c.ri+1];c.ti=Math.floor(k/N);c.tj=k%N;continue}
      let nb=roadNb(c.i,c.j).filter(n=>n[0]!==pi||n[1]!==pj);if(!nb.length)nb=[[pi,pj]];
      const ws=nb.map(n=>{const kk=ix(n[0],n[1]),r=Math.min(2.5,tload[kk]/capOf(kk));return(.06+r*r)*(n[0]-c.i===c.i-pi&&n[1]-c.j===c.j-pj?2:1)});let x=Math.random()*ws.reduce((a,b)=>a+b,0),q=0;while(q<nb.length-1&&(x-=ws[q])>0)q++;const n=nb[q];c.ti=n[0];c.tj=n[1]}}
  cars=cars.filter(c=>!c.dead&&(c.kind?c.life>0:(c.life>0||nN<=target)));
  if(nN>target+4){const q=cars.findIndex(c=>!c.kind);if(q>=0)cars.splice(q,1)}
}

  const flash=(zz,c1,c2)=>{const p=P(vx,vy,zz),on=((t*6)|0)%2;circ(p[0]-2.4,p[1],1.7,on?c1:c2);circ(p[0]+2.4,p[1],1.7,on?c2:c1);glows.push([p[0],p[1],on?c1:c2,10])};
  if(K==='trk'||K==='gar'){const B=seg(0,.68),C=seg(.7,1);box(B[0],B[1],B[2],B[3],z,7,shade(K==='gar'?'#3f9e5a':'#eef1f4'),false);
    if(K==='gar'){const R=seg(0,.16);box(R[0],R[1],R[2],R[3],z,7.6,shade('#2a6b3d'),false)}else{const ff=face(B[0],B[1],B[2],B[3],'L');poly(fq(ff,.12,.88,z+3,z+4.2),c.col)}
    box(C[0],C[1],C[2],C[3],z,5,shade(K==='gar'?'#2f7d46':c.col),false);poly(fq(face(C[0],C[1],C[2],C[3],'L'),.1,.9,z+2.8,z+4.4),'#cfe2f2')}
  else if(K==='fire'){box(x,y,w,d,z,6,shade('#d9473a'),false);const C=seg(.72,1);box(C[0],C[1],C[2],C[3],z+6,1.4,shade('#b8352a'),false);const L=seg(.06,.68);poly(rect(L[0]+(al?0:L[2]*.3),L[1]+(al?L[3]*.3:0),al?L[2]:L[2]*.4,al?L[3]*.4:L[3],z+6.4),'#dfe3e8');
    for(const s of['L','R'])poly(fq(face(x,y,w,d,s),.04,.96,z+1.6,z+2.4),'#ffffff');flash(z+8.2,'#ff3b30','#ffd34d')}
  else if(K==='amb'){box(x,y,w,d,z,6,shade('#ffffff'),false);for(const s of['L','R'])poly(fq(face(x,y,w,d,s),.04,.96,z+2.2,z+3.3),'#e8473a');const C=seg(.74,1);poly(fq(face(C[0],C[1],C[2],C[3],'L'),.1,.9,z+3.6,z+5.2),'#cfe2f2');flash(z+7.6,'#ff3b30','#3b7bff')}
  else if(K==='pol'){box(x,y,w,d,z,2.4,shade('#2b3a55'),false);box(x,y,w,d,z+2.4,1,shade('#ffffff'),false);const cw=al?len*.52:w*.84,cd=al?d*.84:len*.52;box(vx-cw/2,vy-cd/2,cw,cd,z+3.4,2.4,{l:'#cfe2f2',r:'#a9c2d9',t:'#ffffff'},false);flash(z+6.6,'#ff3b30','#3b7bff')}}
const ANGRY=['빨리 고쳐 주세요!','하루만 더 기다릴게요…','이대로면 이사 갈래요','왜 아무도 안 고쳐 줘요?'];
function happyTxt(o){const L=[],near=(k,r)=>(stat.facs||[]).some(f=>f.kind===k&&Math.hypot(f.i+f.w/2-o.i-.5,f.j+f.d/2-o.j-.5)<=r);
  if(o.type==='R'){if(near('bus',6))L.push('버스 덕분에 출근이 편해요');if(near('park',3))L.push('공원에서 산책했어요');if(o.lm)L.push('명소가 가까워서 자랑스러워요');if(o.school&&o.stage>=2)L.push('아이 학교가 가까워요');
    if(HON&&o.health)L.push('아플 때 병원에 바로 가요');if((o.traffic||0)<.35&&o.stage>=3)L.push('출근길이 뻥 뚫렸어요');if(tax<=7)L.push('세금이 싸서 좋아요');if((o.air||0)<4)L.push('공기가 정말 맑아요');L.push(...HAPPY.R.filter(t=>o.clean||t!=='물이 깨끗해요'))}
  else if(o.type==='C'){if(near('bus',6))L.push('버스 타고 손님이 와요');if(o.lm)L.push('관광객 손님이 많아요');L.push(...HAPPY.C)}
  else{L.push(...HAPPY.I);if(o.out)L.push('트럭이 물건을 싣고 나가요')}
  return L[Math.random()*L.length|0]}
/* 도시 소리: 화면에 보이는 곳에 따라 섞어요(시내 웅성거림·차 소리·물결·빗소리 + 새·풀벌레·갈매기·공사 소리). 소리 버튼으로 함께 꺼져요 */
const AMB={n:null,t:0,ev:{bird:2,cri:2,gull:6,con:2,horn:8},c:null};
function ambInit(){if(AMB.n||!AC)return;try{const sr=AC.sampleRate,len=sr*2,mk=(f)=>{const b=AC.createBuffer(1,len,sr),d=b.getChannelData(0);f(d);return b};
  const brown=mk(d=>{let l=0;for(let k=0;k<len;k++){l=(l+.02*(Math.random()*2-1))/1.02;d[k]=l*3.2}}),white=mk(d=>{for(let k=0;k<len;k++)d[k]=Math.random()*2-1});
  const master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  const loop=(buf,type,f,q)=>{const s2=AC.createBufferSource();s2.buffer=buf;s2.loop=true;s2.loopStart=0;s2.loopEnd=2;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;if(q)fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s2.connect(fl);fl.connect(g);g.connect(master);s2.start(AC.currentTime+Math.random()*.5);return g};
  const city=loop(brown,'lowpass',360),traf=loop(white,'bandpass',620,.7),wave=loop(brown,'lowpass',650),rain=loop(white,'highpass',1700);
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.11;lg.gain.value=0;lfo.connect(lg);lg.connect(wave.gain);lfo.start();
  AMB.n={master,city,traf,wave,lg,rain}}catch(e){AMB.n=null}}
function ambCensus(){const C=[screenToWorld(0,hudB),screenToWorld(W,hudB),screenToWorld(0,H),screenToWorld(W,H)],xs=C.map(p=>p[0]),ys=C.map(p=>p[1]);
  const i0=Math.max(0,Math.floor(Math.min(...xs))),i1=Math.min(N-1,Math.ceil(Math.max(...xs))),j0=Math.max(0,Math.floor(Math.min(...ys))),j1=Math.min(N-1,Math.ceil(Math.max(...ys)));
  if(i1<i0||j1<j0)return null;const st=Math.max(1,Math.round(Math.sqrt((i1-i0+1)*(j1-j0+1)/900)));let n=0,bl=0,tr=0,sea_=0,riv=0,con=0,ld=0,rd=0;
  for(let i=i0;i<=i1;i+=st)for(let j=j0;j<=j1;j+=st){const k=ix(i,j);n++;if(sea[k])sea_++;else if(water[k])riv++;if(road[k]){rd++;ld+=Math.min(2,tload[k]/capOf(k))}const o=tobj[k];if(o){if(o.kind==='bld'&&o.stage>0)bl+=o.stage;else if(o.kind==='tree'||o.kind==='park')tr++;if(o.build>0&&FAC[o.kind])con++}}
  return n?{bl:bl/n,tr:tr/n,sea:sea_/n,riv:riv/n,con,ld:rd?ld/rd:0,rd:rd/n}:null}
function ambTick(dt){if(!AC||!soundOn){if(AMB.n)AMB.n.master.gain.setTargetAtTime(0,AC.currentTime,.3);return}ambInit();if(!AMB.n)return;const A=AMB.n,now=AC.currentTime;
  AMB.t-=dt;if(AMB.t<=0){AMB.t=.6;AMB.c=ambCensus()}const c=AMB.c;if(!c)return;const h=hod(),day=h>=6&&h<19.5,night=h>=20||h<5,cl=v=>Math.max(0,Math.min(1,v));
  const mv=document.hidden||(modalOpen&&!idle)?0:(idle?.55:1)*cl(.55+.45*S);A.master.gain.setTargetAtTime(mv,now,.4);
  const rush=Math.min(1,.35+Math.exp(-((h-8)**2)/2.4)*.7+Math.exp(-((h-18)**2)/3.4)*.7)*(h<5||h>=23?.3:1);
  A.city.gain.setTargetAtTime(.07*cl(c.bl*1.6)*(night?.55:1),now,.6);A.traf.gain.setTargetAtTime(.03*cl(c.rd*4)*cl(.2+c.ld*1.4)*rush,now,.6);
  const wv=.06*cl(c.sea*2.4)+.03*cl(c.riv*6);A.wave.gain.setTargetAtTime(wv*.6,now,.8);A.lg.gain.setTargetAtTime(wv*.4,now,.8);A.rain.gain.setTargetAtTime(.08*(typeof rainA==='number'?rainA:0),now,.5);
  if(mv<.05)return;const E=AMB.ev;for(const k in E)E[k]-=dt;
  const tone=(f1,f2,dur,g,type,dl)=>{const o=AC.createOscillator(),gg=AC.createGain(),t0=now+(dl||0);o.type=type||'sine';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);gg.gain.setValueAtTime(.0001,t0);gg.gain.exponentialRampToValueAtTime(g*mv,t0+.01);gg.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(gg);gg.connect(AC.destination);o.start(t0);o.stop(t0+dur+.03)};
  if(E.bird<=0){E.bird=1.6+Math.random()*4;if(day&&c.tr>.04){const g=.014*cl(c.tr*5),f=2300+Math.random()*1500,n2=2+(Math.random()*3|0);for(let q=0;q<n2;q++)tone(f,f*(1.2+Math.random()*.3),.07,g,'sine',q*.11)}}
  if(E.cri<=0){E.cri=1.2+Math.random()*2;if(night&&(c.tr>.03||c.bl<.2)){for(let q=0;q<4;q++)tone(4300,4400,.035,.006,'triangle',q*.06)}}
  if(E.gull<=0){E.gull=7+Math.random()*9;if(day&&c.sea>.12){for(let q=0;q<2;q++)tone(1150,720,.28,.012*cl(c.sea*3),'sawtooth',q*.34)}}
  if(E.con<=0){E.con=1+Math.random()*1.6;if(day&&c.con>0){tone(1900,1700,.09,.014,'triangle');tone(160,90,.08,.02,'sine',.02)}}
  if(E.horn<=0){E.horn=5+Math.random()*9;if(day&&c.ld>1&&c.rd>.05){tone(420,420,.16,.007,'square');tone(520,520,.16,.005,'square',.02)}}}
