<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb21a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 동네">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffb21a'/%3E%3Cpath d='M12 50V32l10-6v24M22 50V18l14-4v36M36 50V26l14 5v19M10 50h44' fill='none' stroke='%235a3600' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>우리 동네 짓기 v0.41.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* 레이아웃: 화면을 가득 채운 게임 창 하나. 위 자원 막대, 왼쪽 미션 카드, 오른쪽 나침반·지도 버튼, 아래 도구 막대(펼침 메뉴), 떠 있는 정보 카드·현황 서랍 */
:root{
  --bg:#dfe7ec;--ink:#1d2738;--muted:#5c6878;
  --panel:rgba(255,255,255,.95);--panel-solid:#ffffff;--line:rgba(29,39,56,.1);--soft:#f2f5f8;
  --accent:#ffb21a;--accent-deep:#e08e00;--accent-soft:#fff3d6;--accent-ink:#6b4300;
  --ok:#2f8a4e;--bad:#c63d2f;--warn:#a46a00;--civil:#2867b2;--civil-soft:#e3eefb;--build:#b04a1f;--build-soft:#fdeadf;
  --shadow:0 6px 18px rgba(22,34,52,.16),0 1px 3px rgba(22,34,52,.12);
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121821;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px}
.game{position:relative;height:calc(100dvh - 20px);min-height:560px;border-radius:18px;overflow:hidden;background:#bfe3f5;user-select:none;-webkit-user-select:none;color:var(--ink);touch-action:none}
#mission,#drawer,#sns,#modal{touch-action:pan-y}
#dock,#fly{touch-action:pan-x}
#city{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ov{position:absolute;z-index:2}
.pnl{background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
button{font:inherit;color:var(--ink);background:var(--panel-solid);border:0;border-radius:10px;cursor:pointer;min-height:40px;padding:0 12px}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{display:block;flex:none}
/* 위 막대 */
#hud{top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;height:48px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#5a3600}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.brand small{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:15px;color:var(--muted);line-height:1;margin-top:3px;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;height:48px;padding:0 14px 0 8px;position:relative}
.pill .pi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.pill .pv{display:flex;flex-direction:column;line-height:1}
.pill .pk{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.pill .pn{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pill .pn.neg{color:var(--bad)}
#mDelta{position:absolute;right:8px;top:-4px;font-family:var(--display);font-size:14px;color:var(--ok);opacity:0;transition:opacity .3s,transform .9s;pointer-events:none}
#mDelta.on{opacity:1;transform:translateY(-10px)}
.grow{flex:1}
.ctrl{display:flex;gap:4px;padding:4px;height:48px;align-items:center}
.ctrl button{min-height:40px;min-width:40px;padding:0 9px;display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:15px;background:transparent}
.ctrl button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ctrl .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
#menu{background:var(--accent);color:#3b2500}
/* 미션 카드 */
#mission{left:10px;width:min(320px,calc(100% - 90px));padding:12px 14px 13px;font-size:13.5px;line-height:1.45}
#mission[hidden]{display:none}
#mission .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
#mission .ml .mstg{font-style:normal;font-family:var(--body);font-size:11.5px;line-height:1.5;color:#1e4f7c;background:#e3eefb;border-radius:999px;padding:0 7px;margin-left:3px;white-space:nowrap}
.learn{background:#eef5fd;border-radius:12px;padding:9px 12px;color:#1e3a5c}
.learn b{color:#1e4f7c}
#mission .ml{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:14px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 10px 2px 7px}
#mission .mt{font-family:var(--display);font-size:22px;line-height:1.2;margin:6px 0 2px}
#mission p{margin:0 0 8px;color:#3d4a5a}
#mission ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#mission li .row{display:flex;justify-content:space-between;gap:8px;font-weight:500}
#mission li .v{font-family:var(--display);font-size:15px;color:#3d4a5a;white-space:nowrap;font-variant-numeric:tabular-nums}
#mission li.ok .v{color:var(--ok)}
#mission .bar2{height:8px;background:#e5eaf0;border-radius:4px;overflow:hidden;margin-top:4px}
#mission .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffc94d,#ffa600);border-radius:4px}
#mission li.ok .bar2 i{background:linear-gradient(90deg,#6fd08a,#2fa356)}
#mission .mtime{display:flex;align-items:center;gap:5px;margin-top:9px;font-family:var(--display);font-size:15px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
#mission .mtime.low{color:var(--bad)}
#mission .fold{min-height:36px;min-width:36px;padding:0;display:grid;place-items:center;background:var(--soft)}
#mission.folded p,#mission.folded .mchecks,#mission.folded .hint{display:none}
#mission.compact p,#mission.compact .hint,#mission.compact .reqs{display:none}
#mission .hint{display:flex;gap:6px;margin-top:8px;font-size:12.5px;color:var(--civil);background:var(--civil-soft);border-radius:8px;padding:6px 8px}
/* 오른쪽 지도 버튼 */
#mapctl{right:10px;display:grid;grid-template-columns:repeat(2,42px);gap:4px;padding:6px}
#mapctl button{width:42px;min-height:42px;padding:0;display:grid;place-items:center;background:transparent}
#mapctl button:hover{background:var(--soft)}
#mapctl #zhome{grid-column:span 2;width:auto}
#mapctl.row3{grid-template-columns:repeat(3,40px);gap:2px;padding:4px}
#mapctl.row3 button,#mapctl.row3 #zhome{grid-column:auto;width:40px;min-height:40px}
#views.short{gap:1px;padding:4px}
#views.short button{min-height:34px}
#views.short label{padding:2px 0 0}
#views.short label svg,#views.short label span{display:none}
/* 정보 보기(시티즈: 스카이라인의 인포뷰처럼 오른쪽 세로 막대) */
#views{right:10px;display:flex;flex-direction:column;gap:3px;padding:5px;width:64px}
#views button{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-family:var(--display);font-size:13px;background:transparent}
#views button[aria-pressed="true"]{background:var(--ink);color:#fff}
#views label{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--display);font-size:13px;padding:6px 0 2px;border-top:1px solid var(--line);margin-top:2px}
#views select{font:inherit;font-family:var(--display);font-size:12.5px;border:0;background:var(--soft);border-radius:8px;min-height:36px;width:56px;padding:0 2px;color:var(--ink)}
/* 수요 막대 */
.rci{display:flex;gap:5px;align-items:stretch;padding:6px 10px 4px 6px;margin-right:2px;border-right:1px solid var(--line);flex:none;min-height:70px}
.rci div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;width:15px}
.rci b{display:flex;align-items:flex-end;width:11px;height:40px;background:var(--soft);border-radius:4px;overflow:hidden}
.rci i{display:block;width:100%;border-radius:4px;transition:height .5s}
.rci span{font-family:var(--display);font-size:12.5px;color:var(--muted);line-height:1}
/* 도구 막대 */
#dock{left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:4px;padding:6px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:70px;min-height:70px;padding:6px 2px;background:transparent;border-radius:12px;position:relative;flex:none}
.cat .ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}
.cat span{font-family:var(--display);font-size:14px;line-height:1}
.cat[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cat.locked .ci{background:#c3cad3 !important}
.cat.locked span{color:#97a1ad}
.cat .dot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#2fa356;box-shadow:0 0 0 2px #fff}
.cat .more{position:absolute;bottom:22px;right:12px;width:14px;height:14px;border-radius:50%;background:#fff;color:var(--muted);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
#fly{bottom:96px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;max-width:calc(100% - 20px);overflow-x:auto}
#fly[hidden]{display:none}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:150px;min-height:120px;padding:10px 12px;background:var(--soft);border-radius:12px;text-align:left;flex:none}
.item .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;margin-bottom:2px}
.item b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15}
.item small{font-size:12px;color:var(--muted);line-height:1.35}
.item .price{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;font-family:var(--display);font-size:14px;color:var(--accent-ink);margin-top:auto}
.item.locked{opacity:.55}
.item[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
#toolTip{left:50%;transform:translateX(-50%);bottom:96px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;font-size:14px;white-space:nowrap;max-width:calc(100% - 20px)}
@media (min-width:761px){#toolTip{max-width:calc(100% - 196px)}}
#toolTip[hidden]{display:none}
#toolTip .bpt{padding:0 10px;display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:14px;flex:none}
#toolTip .bpt[aria-pressed="true"]{background:#2a6fdb;color:#fff}
#bp{left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;font-size:14px;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;box-shadow:0 0 0 2px #2a6fdb,var(--shadow);color:#1e4f7c}
#bp[hidden]{display:none}
@media (min-width:1000px){#bp{width:max-content}}
#bp b{font-family:var(--display);font-weight:400;font-size:16px}
#bp button{min-height:36px;font-family:var(--display);font-size:14.5px;background:var(--soft)}
#bp .go{background:#2f8a4e;color:#fff}
#toolTip b{font-family:var(--display);font-weight:400;font-size:16px}
#info .xbtn{display:block;width:100%;margin-top:8px;padding:8px 10px;border:0;border-radius:10px;background:#2f8a4e;color:#fff;font:inherit;font-size:14px;cursor:pointer}
#unlock.buyl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#unlock.buyl button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:1px solid #d8dee6;border-radius:10px;background:#fff;font:inherit;font-size:13px;cursor:pointer;text-align:left}
#unlock.buyl button b{font-weight:600}
#unlock.buyl button small{color:#66707c;font-size:12px}
#unlock.buyl button:disabled{opacity:.5;cursor:default}
#unlock.buyl .wide{grid-column:1/-1}
#info .xbtn.rep{background:#d98a2b}
#info .xbtn:disabled{background:#c9d3cc;color:#55615a;cursor:default}
#toolTip .soil{flex:none;font-size:13px;color:#7a5a32;background:#f3eadb;border-radius:8px;padding:3px 8px}
#toolTip .soil b{font-size:14px}
#toolTip span{overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
#toolTip button{min-height:36px;min-width:36px;padding:0;display:grid;place-items:center;background:var(--soft)}
#toolTip .rmode{display:flex;gap:3px;background:var(--soft);border-radius:10px;padding:3px;flex:none}
#toolTip .rmode button{padding:0 10px;font-family:var(--display);font-size:14px;background:transparent;min-height:34px;display:flex}
#toolTip .bpg button{align-items:center;gap:3px}
#toolTip .bpg button[data-bp="1"][aria-pressed="true"]{background:#2a6fdb}
#toolTip .rmode button[aria-pressed="true"]{background:var(--ink);color:#fff}
/* 정보 카드 */
#info{left:10px;bottom:96px;width:min(330px,calc(100% - 20px));padding:13px 14px;font-size:14px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#info[hidden]{display:none}
#info .ih{display:flex;gap:10px;align-items:flex-start}
#info .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
#info .nm{font-family:var(--display);font-size:21px;line-height:1.15}
#info .x{margin-left:auto;min-height:30px;min-width:30px;padding:0;display:grid;place-items:center;background:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.build{background:var(--build-soft);color:var(--build)}
.tag.civil{background:var(--civil-soft);color:var(--civil)}
.tag.lock{background:var(--accent-soft);color:var(--accent-ink)}
.tag.lux{background:#fff1c9;color:#7a5600}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.checks .m{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;margin-top:1px}
.checks .y .m{background:#3aa65c}.checks .n .m{background:#d9573f}.checks .w .m{background:#e0a422}
.checks .why{display:block;color:var(--muted);font-size:12.5px}
#infoDesc{margin:9px 0 0;color:#3d4a5a;font-size:13.5px}
/* 현황 서랍 */
#drawer{right:10px;width:min(330px,calc(100% - 20px));max-height:calc(100% - 200px);overflow-y:auto;padding:14px 16px}
#drawer[hidden]{display:none}
#sns{right:10px;width:min(320px,calc(100% - 20px));max-height:calc(100% - 200px);overflow-y:auto;padding:14px 16px}
#sns[hidden]{display:none}
#sns h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
#sns h3 button{min-height:30px;min-width:30px;padding:0;display:grid;place-items:center;background:var(--soft)}
#sns .feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#sns .feed li{display:flex;gap:9px;padding:9px 10px;border-radius:12px;background:#f6f8fb}
#sns .feed li.b{background:#fff3ef}
#sns .feed .fc{font-size:22px;line-height:1}
#sns .feed b{font-size:13px;margin-right:6px}
#sns .feed small{color:var(--muted);font-size:11.5px}
#sns .feed p{margin:3px 0 0;font-size:13.5px;line-height:1.4}
#snsBtn{position:relative}
#snsBtn .sbdg{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#d9473a;color:#fff;font:600 10px/16px system-ui;font-style:normal;padding:0 4px}
#drawer h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
#drawer h3 button{min-height:30px;min-width:30px;padding:0;display:grid;place-items:center;background:var(--soft)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:right;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.dem{display:flex;gap:10px;margin:12px 0 4px;align-items:flex-end;height:60px;background:var(--soft);border-radius:10px;padding:8px 10px 6px}
.dem div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.dem i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;min-height:3px}
.wide{width:100%;margin-top:10px;background:var(--accent);color:#3b2500;font-family:var(--display);font-size:16px}
.wide:disabled{background:var(--soft);color:var(--muted);cursor:default}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding:7px 9px;border-radius:9px;background:var(--soft);line-height:1.45}
.log li time{color:var(--muted);font-size:11.5px;margin-right:5px;font-variant-numeric:tabular-nums}
/* 알림·자막·창 */
#toast{left:50%;transform:translate(-50%,-6px);max-width:min(560px,calc(100% - 40px));background:rgba(29,39,56,.94);color:#fff;font-size:14.5px;padding:10px 16px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;z-index:4;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#cap{left:50%;transform:translateX(-50%);bottom:96px;width:min(680px,calc(100% - 24px));display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;z-index:4}
#cap[hidden]{display:none}
#capStep{flex:none;background:var(--accent);color:#3b2500;font-family:var(--display);font-size:15px;border-radius:999px;padding:2px 11px;font-variant-numeric:tabular-nums}
#capText{margin:0;font-size:15px;line-height:1.5;flex:1}
#capStop{flex:none;background:var(--soft);min-height:36px;font-family:var(--display)}
#modal{position:absolute;inset:0;background:rgba(18,28,44,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:6;overflow:auto}
#modal[hidden]{display:none}
.mcard{background:#fff;border-radius:22px;width:100%;max-width:520px;padding:24px 24px 20px;margin:auto;box-shadow:0 20px 50px rgba(10,20,40,.35)}
.mcard.wide{max-width:940px}
.mcard h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.15;margin:0 0 6px}
.mcard .sub{margin:0 0 14px;color:#4a5767;font-size:15px}
.mcard .eyebrow{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-size:15px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 11px;margin-bottom:8px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.hero .logo{width:56px;height:56px;border-radius:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;min-height:108px;background:#f4f6f9;border-radius:16px;font-weight:400;line-height:1.45}
.mode:hover{background:#eef2f6;box-shadow:inset 0 0 0 2px #ffcf6a}

  if(i1<i0||j1<j0)return null;const st=Math.max(1,Math.round(Math.sqrt((i1-i0+1)*(j1-j0+1)/900)));let n=0,bl=0,tr=0,sea_=0,riv=0,con=0,ld=0,rd=0;
  for(let i=i0;i<=i1;i+=st)for(let j=j0;j<=j1;j+=st){const k=ix(i,j);n++;if(sea[k])sea_++;else if(water[k])riv++;if(road[k]){rd++;ld+=Math.min(2,tload[k]/capOf(k))}const o=tobj[k];if(o){if(o.kind==='bld'&&o.stage>0)bl+=o.stage;else if(o.kind==='tree'||o.kind==='park')tr++;if(o.build>0&&FAC[o.kind])con++}}
  return n?{bl:bl/n,tr:tr/n,sea:sea_/n,riv:riv/n,con,ld:rd?ld/rd:0,rd:rd/n}:null}
function ambTick(dt){if(!AC||!soundOn){if(AMB.n)AMB.n.master.gain.setTargetAtTime(0,AC.currentTime,.3);return}ambInit();if(!AMB.n)return;const A=AMB.n,now=AC.currentTime;
  AMB.t-=dt;if(AMB.t<=0){AMB.t=.6;AMB.c=ambCensus()}const c=AMB.c;if(!c)return;const h=hod(),day=h>=6&&h<19.5,night=h>=20||h<5,cl=v=>Math.max(0,Math.min(1,v));
  const mv=document.hidden||(modalOpen&&!idle)?0:(idle?.55:1)*cl(.55+.45*S);A.master.gain.setTargetAtTime(mv,now,.4);
  const rush=Math.min(1,.35+Math.exp(-((h-8)**2)/2.4)*.7+Math.exp(-((h-18)**2)/3.4)*.7)*(h<5||h>=23?.3:1);
  A.city.gain.setTargetAtTime(.07*cl(c.bl*1.6)*(night?.55:1),now,.6);A.traf.gain.setTargetAtTime(.03*cl(c.rd*4)*cl(.2+c.ld*1.4)*rush,now,.6);
  const wv=.06*cl(c.sea*2.4)+.03*cl(c.riv*6);A.wave.gain.setTargetAtTime(wv*.6,now,.8);A.lg.gain.setTargetAtTime(wv*.4,now,.8);A.rain.gain.setTargetAtTime(.08*(typeof rainA==='number'?rainA:0),now,.5);
  if(mv<.05)return;const E=AMB.ev;for(const k in E)E[k]-=dt;
  const tone=(f1,f2,dur,g,type,dl)=>{const o=AC.createOscillator(),gg=AC.createGain(),t0=now+(dl||0);o.type=type||'sine';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);gg.gain.setValueAtTime(.0001,t0);gg.gain.exponentialRampToValueAtTime(g*mv,t0+.01);gg.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(gg);gg.connect(AC.destination);o.start(t0);o.stop(t0+dur+.03)};
  if(E.bird<=0){E.bird=1.6+Math.random()*4;if(day&&c.tr>.04){const g=.014*cl(c.tr*5),f=2300+Math.random()*1500,n2=2+(Math.random()*3|0);for(let q=0;q<n2;q++)tone(f,f*(1.2+Math.random()*.3),.07,g,'sine',q*.11)}}
  if(E.cri<=0){E.cri=1.2+Math.random()*2;if(night&&(c.tr>.03||c.bl<.2)){for(let q=0;q<4;q++)tone(4300,4400,.035,.006,'triangle',q*.06)}}
  if(E.gull<=0){E.gull=7+Math.random()*9;if(day&&c.sea>.12){for(let q=0;q<2;q++)tone(1150,720,.28,.012*cl(c.sea*3),'sawtooth',q*.34)}}
  if(E.con<=0){E.con=1+Math.random()*1.6;if(day&&c.con>0){tone(1900,1700,.09,.014,'triangle');tone(160,90,.08,.02,'sine',.02)}}
  if(E.horn<=0){E.horn=5+Math.random()*9;if(day&&c.ld>1&&c.rd>.05){tone(420,420,.16,.007,'square');tone(520,520,.16,.005,'square',.02)}}}
/* ================= 시작 ================= */
updateViews();
idle=true;newCity({mode:'free',showcase:true});hours=9;lastHour=9;
for(let k=0;k<12;k++){lastHour++;hours++;hourTick()}hours=10.5;lastHour=10;
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)running=false;
setSpeedUI();
resize();window.addEventListener('resize',resize);
setView(fitTiles(UL.i0,UL.j0,UL.i1,UL.j1));
showStart();
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const rdt=(now-last)/1000,dt=Math.min(.05,rdt);last=now;perfTick(now,rdt);
  try{if(flags.ch&&!flags.ch.done&&!idle&&!demo)chFrame(dt);else if(running&&!(modalOpen&&!idle)){const sdt=dt*speed;t+=sdt;updateSim(sdt*24/DAYSEC,sdt)}else t+=dt*.3;
  tutTick(dt);bubT+=dt;if(bubT>2.4){bubT=0;spawnBubble()}for(const b of bubbles)b.l-=dt;coinTick(dt);ambTick(dt);shake=Math.max(0,shake-dt);
  draw(dt);hud()}catch(e){console.error(e)}}
draw(0);hud();requestAnimationFrame(frame);
})();
